<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Application Submitted</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f1f5f9;
    }
    .confirmation-box {
      max-width: 600px;
      margin: 5rem auto;
      background-color: white;
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .confirmation-box h1 {
      color: #0d6efd; /* Bootstrap Blue */
    }  
    .btn-home {
      margin-top: 20px;
      background-color: #0d6efd;
      color: white;
      border: none;
    }
    .btn-home:hover {
      background-color: #0b5ed7;
    }
  </style>
</head>
<body>

  <div class="confirmation-box">
    <h1>🎉 Application Submitted!</h1>
    <p class="lead">Thank you <strong>{{ application['full_name'] }}</strong> for applying.</p>
    <p>We’ve received your application for <strong>{{ job.title }}</strong> at {{ job.location }}.</p>
    <p>If shortlisted, you'll hear from us on your email: <strong>{{application['email']}}</strong></p>

    <a href="/" class="btn btn-home">Back to Home</a>
  </div>

</body>
</html>

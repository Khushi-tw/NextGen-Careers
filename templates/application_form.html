<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enhanced Job Application</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .remove-btn {
      float: right;
      color: red;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="container mt-5">
  <h2 class="text-center mb-4">Job Application Form</h2>
  <form method="POST" action="/jobs/{{ job['id'] }}/apply" enctype="multipart/form-data">

    
    <!-- Basic Info -->
    <div class="mb-3"><label class="form-label">Full Name</label><input type="text" name="full_name" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Phone</label><input type="tel" name="phone_number" class="form-control" required></div>

    <!-- Gender -->
    <div class="mb-3">
      <label class="form-label">Gender</label>
      <select name="gender" class="form-select" required>
        <option value="">-- Select Gender --</option>
        <option>Male</option>
        <option>Female</option>
        <option>Non-Binary</option>
        <option>Prefer not to say</option>
      </select>
    </div>

    <!-- LinkedIn & GitHub -->
    <div class="mb-3"><label class="form-label">LinkedIn</label><input type="url" name="linkedin" class="form-control"></div>
    <div class="mb-3"><label class="form-label">GitHub</label><input type="url" name="github" class="form-control"></div>

    <!-- Education Section -->
    <h5>Education</h5>
    <div id="education-section">
      <div class="row g-2 mb-3 education-entry">
        <div class="col-md-3"><input type="text" name="degree[]" class="form-control" placeholder="Degree Name" required></div>
        <div class="col-md-3"><input type="text" name="college[]" class="form-control" placeholder="College Name" required></div>
        <div class="col-md-2"><input type="number" name="year[]" class="form-control" placeholder="Year" required></div>
        <div class="col-md-2"><input type="text" name="cgpa[]" class="form-control" placeholder="CGPA" required></div>
        <div class="col-md-2 d-none">
          <span class="remove-btn" onclick="removeEntry(this)">Remove</span>
        </div>
      </div>
    </div>
    <button type="button" class="btn btn-sm btn-outline-primary mb-3" onclick="addEducation()">+ Add More Education</button>

    <!-- Work Experience Section -->
    <h5>Work Experience</h5>
    <div id="experience-section"></div>
    <button type="button" class="btn btn-sm btn-outline-primary mb-3" onclick="addExperience()">+ Add Experience</button>

    <!-- Resume and Cover Letter -->
    <div class="mb-3"><label class="form-label">Upload Resume (PDF)</label><input type="file" name="resume" class="form-control" accept=".pdf" required></div>
    <div class="mb-3"><label class="form-label">Why should we hire you?</label><textarea name="coverletter" class="form-control" rows="5" required></textarea></div>

    <div class="text-center"><button type="submit" class="btn btn-success">Submit Application</button></div>
  </form>
</div>

<!-- JS for dynamic form -->
<script>
  let educationCount = 1;
  function addEducation() {
    if (educationCount >= 4) return alert("Maximum 4 education entries allowed.");

    const entry = document.createElement('div');
    entry.className = 'row g-2 mb-3 education-entry';
    entry.innerHTML = `
      <div class="col-md-3"><input type="text" name="degree[]" class="form-control" placeholder="Degree Name"></div>
      <div class="col-md-3"><input type="text" name="college[]" class="form-control" placeholder="College Name"></div>
      <div class="col-md-2"><input type="number" name="year[]" class="form-control" placeholder="Year"></div>
      <div class="col-md-2"><input type="text" name="cgpa[]" class="form-control" placeholder="CGPA"></div>
      <div class="col-md-2">
        <span class="remove-btn" onclick="removeEntry(this)">Remove</span>
      </div>`;
    document.getElementById('education-section').appendChild(entry);
    educationCount++;
  }

  function removeEntry(el) {
    el.closest('.education-entry').remove();
    educationCount--;
  }

  function addExperience() {
    const wrapper = document.createElement('div');
    wrapper.className = 'border rounded p-3 mb-3';
    wrapper.innerHTML = `
      <div class="row mb-2">
        <div class="col-md-6"><input type="text" name="company[]" class="form-control" placeholder="Company Name" required></div>
        <div class="col-md-6"><input type="text" name="job_role[]" class="form-control" placeholder="Job Role" required></div>
      </div>
      <div class="mb-2"><textarea name="responsibility[]" class="form-control" placeholder="Responsibilities" required></textarea></div>
      <div class="row g-2 mb-2">
        <div class="col-md-6"><label>Start Date</label><input type="date" name="start_date[]" class="form-control" onchange="calcDuration(this)"></div>
        <div class="col-md-6"><label>End Date</label><input type="date" name="end_date[]" class="form-control" onchange="calcDuration(this)"></div>
      </div>
      <div><small class="text-muted" id="duration-msg">Experience: 0 months</small></div>
      <div class="text-end"><span class="remove-btn" onclick="this.closest('.border').remove()">Remove</span></div>
    `;
    document.getElementById('experience-section').appendChild(wrapper);
  }

  function calcDuration(input) {
    const wrapper = input.closest('.border');
    const start = new Date(wrapper.querySelector('[name="start_date[]"]').value);
    const end = new Date(wrapper.querySelector('[name="end_date[]"]').value);
    const msg = wrapper.querySelector('#duration-msg');

    if (start && end && start <= end) {
      const diff = end - start;
      const months = Math.floor(diff / (1000 * 60 * 60 * 24 * 30));
      const years = Math.floor(months / 12);
      const remainingMonths = months % 12;
      msg.innerText = `Experience: ${years} year(s), ${remainingMonths} month(s)`;
    } else {
      msg.innerText = 'Experience: Invalid date range';
    }
  }
</script>
</body>
</html>
